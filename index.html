<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123e73" />
  <meta name="description" content="Restaurante La Onda, Murcia. Cocina mediterránea, mariscos, arroces, pescados y carnes." />
  <title>Restaurante La Onda | Carta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#123e73;
  --navy2:#0d2f59;
  --blue:#1d5c9e;
  --sea:#5b8e8c;
  --ivory:#f7f3e9;
  --paper:#fffdf8;
  --sand:#e6d7b2;
  --wood:#a96f3c;
  --woodDark:#704626;
  --ink:#1b2a38;
  --muted:#66727e;
  --line:rgba(18,62,115,.13);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  padding-bottom:90px;
  font-family:"DM Sans",Arial,sans-serif;
  color:var(--ink);
  background:
  linear-gradient(
    90deg,
    var(--woodDark) 0,
    var(--wood) 11px,
    var(--ivory) 11px,
    var(--ivory) calc(100% - 11px),
    var(--wood) calc(100% - 11px),
    var(--woodDark) 100%
  );
}

button{
  font:inherit;
}

a{
  color:inherit;
}

/* CABECERA */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,243,233,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.topbar-inner{
  width:min(100%,1100px);
  margin:auto;
  padding:9px 16px 8px;
}

.brand-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:3px solid var(--sand);
  background:var(--navy);
  color:white;
  font-family:"Marcellus",serif;
  font-size:22px;
  box-shadow:0 4px 14px rgba(13,47,89,.16);
}

.brand{
  flex:1;
  min-width:0;
}

.brand strong{
  display:block;
  font-family:"Marcellus",serif;
  font-size:21px;
  font-weight:400;
  color:var(--navy2);
}

/* IDIOMAS */

.language-picker{
  position:relative;
  flex:none;
}

.language-button{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid rgba(18,62,115,.10);
  border-radius:999px;
  background:rgba(255,253,248,.85);
  color:var(--navy2);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(13,47,89,.04);
}

.language-current{
  display:flex;
  align-items:center;
  gap:7px;
}

.language-arrow{
  color:var(--wood);
  font-size:14px;
}

.flag-real{
  width:23px;
  height:15px;
  display:inline-flex;
  overflow:hidden;
  flex:none;
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.10);
}

.flag-real svg{
  display:block;
  width:100%;
  height:100%;
}

.language-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  width:172px;
  padding:6px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.17);
  background:
  linear-gradient(
    145deg,
    rgba(13,47,89,.99),
    rgba(29,92,158,.96) 58%,
    rgba(91,142,140,.92)
  );
  box-shadow:0 18px 42px rgba(13,47,89,.30);

  opacity:0;
  visibility:hidden;
  transform:translateY(-5px) scale(.98);
  transform-origin:top right;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease;
}

.language-menu.open{
  opacity:1;
  visibility:visible;
  transform:none;
}

.language-option{
  width:100%;
  display:grid;
  grid-template-columns:28px 1fr 18px;
  align-items:center;
  gap:7px;

  padding:9px 8px;
  border:0;
  border-radius:11px;

  background:transparent;
  color:rgba(255,255,255,.90);

  text-align:left;
  font-size:12px;
  cursor:pointer;
}

.language-option:hover{
  background:rgba(255,255,255,.10);
}

.language-option.active{
  background:rgba(255,255,255,.14);
  color:white;
  font-weight:800;
}

.language-check{
  opacity:0;
  color:var(--sand);
  font-weight:900;
}

.language-option.active .language-check{
  opacity:1;
}

/* CATEGORÍAS SUPERIORES */

.category-nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-top:8px;
  padding-bottom:1px;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}

.category-nav::-webkit-scrollbar{
  display:none;
}

.category-nav a{
  flex:none;
  scroll-snap-align:start;
  padding:8px 11px;
  border-radius:999px;
  border:1px solid rgba(18,62,115,.10);
  background:rgba(255,253,248,.72);

  color:var(--navy);
  text-decoration:none;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
}

/* PRESENTACIÓN */

.hero{
  width:min(100%,1100px);
  margin:auto;
  padding:34px 22px 27px;
  text-align:center;
}

.crest{
  width:74px;
  height:74px;
  display:grid;
  place-items:center;
  margin:0 auto 14px;

  border-radius:50%;
  border:1px solid rgba(18,62,115,.18);
  background:var(--paper);

  color:var(--navy);
  font-size:31px;

  box-shadow:0 14px 35px rgba(13,47,89,.08);
}

.eyebrow{
  color:var(--wood);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:10px;
  font-weight:800;
}

h1{
  margin:5px 0 8px;
  font-family:"Marcellus",serif;
  color:var(--navy2);
  font-size:clamp(36px,9vw,64px);
  font-weight:400;
  line-height:.98;
}

.hero p{
  max-width:600px;
  margin:auto;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* CARTA */

main{
  width:min(100%,980px);
  margin:auto;
  padding:0 14px 30px;
}

.section{
  scroll-margin-top:130px;
  margin-bottom:35px;
}

.section-head{
  display:flex;
  justify-content:center;
  text-align:center;
  margin-bottom:14px;
}

.section h2{
  margin:0;
  font-family:"Marcellus",serif;
  color:var(--navy);
  font-size:29px;
  font-weight:400;
}

.menu-grid{
  display:grid;
  gap:10px;
}

.dish{
  position:relative;
  overflow:hidden;

  padding:13px 12px 12px;

  border:1px solid var(--line);
  border-radius:16px;

  background:rgba(255,253,248,.95);

  box-shadow:0 7px 22px rgba(13,47,89,.035);
}

.dish.popular{
  border-color:rgba(169,111,60,.45);
  background:
  linear-gradient(
    115deg,
    rgba(230,215,178,.19),
    rgba(255,253,248,.99) 45%
  );
}

.dish.popular::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--wood);
}

.dish-top{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:10px;
  align-items:start;
}

.dish-number{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--navy);
  color:white;

  font-size:12px;
  font-weight:800;
}

.dish-name{
  margin-top:1px;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
}

.dish-sub{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:400;
}

.price{
  padding-top:2px;
  color:var(--navy);
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  text-align:right;
}

.price small{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:600;
}

.dish-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;

  margin:8px 0 0 48px;
}

.tag{
  padding:4px 7px;

  border:1px solid rgba(169,111,60,.18);
  border-radius:999px;

  background:rgba(169,111,60,.12);
  color:#82532e;

  font-size:10px;
  font-weight:800;
}

/* ALÉRGENOS */

.allergen{
  width:26px;
  height:26px;

  display:inline-grid;
  place-items:center;

  border-radius:50%;
  flex:none;
}

.allergen-symbol{
  width:26px;
  height:26px;

  display:grid;
  place-items:center;

  border-radius:50%;
  color:white;

  box-shadow:
  inset 0 0 0 1px rgba(255,255,255,.20);
}

.allergen-symbol svg{
  width:16px;
  height:16px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.65;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* colores como la carta física */

.allergen-gluten{background:#c85b3d}
.allergen-crust{background:#438ab0}
.allergen-egg{background:#d9983c}
.allergen-fish{background:#215e99}
.allergen-peanut{background:#9b674c}
.allergen-soy{background:#4c8e7f}
.allergen-milk{background:#353535}
.allergen-nuts{background:#8d4b5b}
.allergen-celery{background:#55a874}
.allergen-mustard{background:#c9a137}
.allergen-sesame{background:#6c6a67}
.allergen-sulfites{background:#b9903b}
.allergen-lupin{background:#d4a22d}
.allergen-molluscs{background:#4694ae}

/* INFORMACIÓN */

.info-panel{
  margin-top:38px;
  padding:23px;

  border-radius:24px;

  background:var(--navy2);
  color:white;

  box-shadow:0 14px 35px rgba(13,47,89,.14);
}

.info-panel h2{
  margin:0 0 8px;
  font-family:"Marcellus",serif;
  font-size:28px;
  font-weight:400;
}

.info-panel > p{
  margin:0 0 20px;
  color:rgba(255,255,255,.72);
  font-size:13px;
}

.info-list{
  display:grid;
  gap:10px;
}

.info-item{
  display:flex;
  align-items:flex-start;
  gap:12px;

  padding:12px;

  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;

  background:rgba(255,255,255,.07);

  text-decoration:none;
}

.info-icon{
  font-size:20px;
}

.info-item strong{
  display:block;
  font-size:13px;
}

.info-item span{
  color:rgba(255,255,255,.72);
  font-size:12px;
}

/* LEYENDA */

.legend{
  margin-top:25px;
  padding:18px;

  border:1px solid var(--line);
  border-radius:20px;

  background:var(--paper);
}

.legend h3{
  margin:0 0 4px;

  font-family:"Marcellus",serif;
  color:var(--navy);
  font-size:22px;
  font-weight:400;
}

.legend-note{
  margin-bottom:13px;

  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}

.legend-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:11px;
}

/* BARRA INFERIOR */

.floating-bar{
  position:fixed;
  left:50%;
  bottom:max(10px,env(safe-area-inset-bottom));

  z-index:200;

  width:min(520px,calc(100% - 24px));

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  padding:8px;

  transform:translateX(-50%);

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;

  background:rgba(13,47,89,.94);

  backdrop-filter:blur(14px);

  box-shadow:0 14px 38px rgba(7,27,52,.28);
}

.floating-bar a{
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  border-radius:12px;

  text-decoration:none;

  font-size:13px;
  font-weight:800;
}

.call-btn{
  background:white;
  color:var(--navy2);
}

.map-btn{
  background:var(--wood);
  color:white;
}

.footer{
  padding:25px 20px 14px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
}

/* ANIMACIONES */

.fade{
  opacity:0;
  transform:translateY(8px);

  transition:
  opacity .42s ease,
  transform .42s ease;
}

.fade.visible{
  opacity:1;
  transform:none;
}

/* TABLET */

@media(min-width:720px){

  body{
    background:
    linear-gradient(
      90deg,
      var(--woodDark) 0,
      var(--wood) 24px,
      var(--ivory) 24px,
      var(--ivory) calc(100% - 24px),
      var(--wood) calc(100% - 24px),
      var(--woodDark) 100%
    );
  }

  .menu-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .legend-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .info-list{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<section class="hero">

  >

<script>

/* ================================
   ALÉRGENOS
================================ */

const allergenSVG={

function allergenIcon(key){

  <span class="allergen-symbol allergen-${key}">
    ${allergenSVG[key]}
  </span>`;

/* ================================
   CATEGORÍAS
================================ */

const categories=[
["aperitivos","Aperitivos"],
["mariscos","Mariscos"],
["arroces","Arroces"],
["entrantes","Entrantes"],
["verduras","Ensaladas, sopas y verduras"],
["guisos","Guisos y huevos"],

/* ================================
   PLATOS
================================ */

const dishes=[

/* APERITIVOS */

["aperitivos","Anchoa en salmuera","3,20 €",["fish"]],
["aperitivos","Matrimonio","3,20 €",["fish"]],

/* ================================
   FUNCIONES
================================ */

let currentLang="es";

function translatedDish(name){

  if(currentLang==="es"){
    return name;
  }

  if(
    dishT[currentLang] &&
    dishT[currentLang][name]
  ){
    return dishT[currentLang][name];
  }

  return name;
}

function render(){

  const t=ui[currentLang];

  document.documentElement.lang=
    currentLang==="zh"
    ? "zh-CN"
    : currentLang;

  document
  .querySelectorAll("[data-i18n]")
  .forEach(el=>{

    const key=el.dataset.i18n;

    if(t[key]){
      el.textContent=t[key];
    }

  });

  /* navegación */

  const nav=document.getElementById("categoryNav");

  nav.innerHTML=categories
  .map(([id])=>`
    <a href="#${id}">
      ${catT[currentLang][id]}
    </a>
  `)
  .join("");

  /* platos */

  let number=1;

  const menu=document.getElementById("menu");

  menu.innerHTML=categories
  .map(([id])=>{

    const list=dishes.filter(
      dish=>dish[0]===id
    );

    const cards=list
    .map(dish=>{

      const [
        category,
        name,
        price,
        allergens=[],
        tag="",
        unit=""
      ]=dish;

      const dishNumber=
        String(number++)
        .padStart(2,"0");

      const translated=
        translatedDish(name);

      const spanishName=
        currentLang!=="es" &&
        translated!==name

        ? `<span class="dish-sub">${name}</span>`

        : "";

      const allergenHTML=
        allergens
        .map(a=>`
          <span
            class="allergen"
            title="${allergenNames[currentLang][a]}"
          >
            ${allergenIcon(a)}
          </span>
        `)
        .join("");

      const popular=
        tag==="popular";

      return `
      <article class="dish fade ${popular ? "popular" : ""}">

        <div class="dish-top">

          <div class="dish-number">
            ${dishNumber}
          </div>

          <div class="dish-name">
            ${translated}
            ${spanishName}
          </div>

          <div class="price">

            ${price}

            ${
              unit
              ? `<small>${unit}</small>`
              : ""
            }

          </div>

        </div>

        ${
          popular || allergenHTML

          ? `
          <div class="dish-meta">

            ${
              popular

              ? `<span class="tag">
                  🔥 ${t.popular}
                </span>`

              : ""
            }

            ${allergenHTML}

          </div>
          `

          : ""
        }

      </article>
      `;

    })
    .join("");

    return `
    <section
      class="section"
      id="${id}"
    >

      <div class="section-head">

        <h2>
          ${catT[currentLang][id]}
        </h2>

      </div>

      <div class="menu-grid">
        ${cards}
      </div>

    </section>
    `;

  })
  .join("")
  +
  renderInfo(t);

  activateAnimations();

}

/* INFORMACIÓN */

function renderInfo(t){

  const usedAllergens=
    Object
    .keys(allergenNames.es)
    .filter(key=>

      dishes.some(
        dish=>
        (dish[3] || [])
        .includes(key)
      )

    );

  const legend=
    usedAllergens
    .map(key=>`

      <div class="legend-row">

        <span class="allergen">
          ${allergenIcon(key)}
        </span>

        <span>
          ${allergenNames[currentLang][key]}
        </span>

      </div>

    `)
    .join("");

  return `

  <section
    class="info-panel fade"
    id="informacion"
  >

    <h2>
      ${t.info}
    </h2>

    <p>
      ${t.about}
    </p>

    <div class="info-list">

      <a
        class="info-item"
        href="https://www.google.com/maps/search/?api=1&query=Restaurante%20La%20Onda%2C%20C.%20Bando%20de%20la%20Huerta%2C%20s%2Fn%2C%2030008%20Murcia"
        target="_blank"
        rel="noopener"
      >

        <div class="info-icon">
          📍
        </div>

        <div>

          <strong>
            ${t.address}
          </strong>

          <span>
            C. Bando de la Huerta, s/n,
            30008 Murcia
          </span>

        </div>

      </a>

      <div class="info-item">

        <div class="info-icon">
          🕒
        </div>

        <div>

          <strong>
            ${t.hours}
          </strong>

          <span>
            ${t.schedule}
          </span>

        </div>

      </div>

      <a
        class="info-item"
        href="tel:+34968247882"
      >

        <div class="info-icon">
          ☎
        </div>

        <div>

          <strong>
            ${t.phone}
          </strong>

          <span>
            968 24 78 82
          </span>

        </div>

      </a>

    </div>

  </section>

  <section class="legend fade">

    <h3>
      ${t.allergens}
    </h3>

    <div class="legend-note">
      ${t.allergenNote}
    </div>

    <div class="legend-grid">
      ${legend}
    </div>

  </section>

  `;

}

/* ANIMACIÓN */

function activateAnimations(){

  const observer=
  new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

      if(entry.isIntersecting){

        entry.target
        .classList
        .add("visible");

        observer
        .unobserve(entry.target);

      }

    });

  },{
    threshold:.05
  });

  document
  .querySelectorAll(".fade")
  .forEach(el=>observer.observe(el));

}

/* BANDERAS INICIALES */

document
.querySelectorAll("[data-flag]")
.forEach(el=>{

  el.innerHTML=
    flagSVG[el.dataset.flag];

});

/* SELECTOR DE IDIOMA */

const languageButton=
  document.getElementById("languageButton");

const languageMenu=
  document.getElementById("languageMenu");

const languageCurrent=
  document.getElementById("languageCurrent");

languageButton
.addEventListener("click",()=>{

  const open=
    languageMenu
    .classList
    .toggle("open");

  languageButton
  .setAttribute(
    "aria-expanded",
    String(open)
  );

});

document
.querySelectorAll(".language-option")
.forEach(option=>{

  option
  .addEventListener("click",()=>{

    currentLang=
      option.dataset.lang;

    languageCurrent.innerHTML=`

      <span class="flag-real">
        ${flagSVG[currentLang]}
      </span>

      <span>
        ${languageLabels[currentLang]}
      </span>

    `;

    document
    .querySelectorAll(".language-option")
    .forEach(button=>{

      button
      .classList
      .toggle(
        "active",
        button.dataset.lang===currentLang
      );

    });

    languageMenu
    .classList
    .remove("open");

    languageButton
    .setAttribute(
      "aria-expanded",
      "false"
    );

    render();

  });

});

/* CERRAR IDIOMAS AL PULSAR FUERA */

document
.addEventListener("click",event=>{

  if(
    !event.target
    .closest(".language-picker")
  ){

    languageMenu
    .classList
    .remove("open");

    languageButton
    .setAttribute(
      "aria-expanded",
      "false"
    );

  }

});

/* INICIAR */

render();

</script>

</body>
</html>
